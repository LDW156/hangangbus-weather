<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>한강버스 화면 복구</title><style>body{font-family:"Malgun Gothic",sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#eef4f7;color:#153f58}main{padding:28px;background:#fff;border:1px solid #cbdbe4;border-radius:14px;text-align:center}b{display:block;font-size:20px}span{display:block;margin-top:10px}</style></head><body><main><b>화면 캐시를 정리하고 있습니다.</b><span id="status">실데이터 저장값은 유지합니다.</span></main><script>(async()=>{try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}sessionStorage.clear();Object.keys(localStorage).filter(k=>k.startsWith('hangangbus:live-refresh-lock:')).forEach(k=>localStorage.removeItem(k));localStorage.setItem('hangangbus:ui-build','93.0');document.getElementById('status').textContent='화면 캐시 정리 완료 · 직전 실데이터는 유지됩니다.';setTimeout(()=>location.replace('./index.html?v=93.0'),600);}catch(e){document.getElementById('status').textContent='정리 오류: '+e.message;}})();</script></body></html>
