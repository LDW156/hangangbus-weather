<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>사용자 관리 | 한강버스</title>
<style>
:root{--navy:#0e405e;--blue:#2c81b2;--line:#d7e1e8;--bg:#f2f5f7;--ink:#183b50;--muted:#748893;--green:#42b623;--red:#dd4a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:"Malgun Gothic",Arial,sans-serif;color:var(--ink)}button,input,select{font:inherit}.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#fff;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px;padding:5px;border:1px solid #d9e5eb;border-radius:10px}.brand b{font-size:18px}.brand span{display:block;margin-top:2px;font-size:10px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:8px}.top-actions a,.top-actions button{border:1px solid #cbd9e1;border-radius:8px;padding:8px 12px;background:#fff;color:#315b73;font-size:11px;font-weight:900;text-decoration:none;cursor:pointer}.layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 62px)}aside{background:#0e405e;color:#fff;padding:18px 14px}.nav-title{font-size:10px;color:#89b5ca;font-weight:900;margin:8px 10px}.nav a{display:block;padding:11px 12px;margin-bottom:4px;border-radius:9px;color:#dcecf3;text-decoration:none;font-size:12px;font-weight:800}.nav a.active{background:#315f78;color:#fff}.main{padding:20px 22px 36px}.page-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}.page-head h1{margin:0;font-size:28px}.page-head p{margin:6px 0 0;font-size:11px;color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px 12px 0 0}.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:8px}.count{font-weight:950}.search{height:36px;width:260px;border:1px solid #cbd9e1;border-radius:8px;padding:0 10px}.btn{height:36px;padding:0 12px;border:0;border-radius:8px;background:#627790;color:#fff;font-size:11px;font-weight:900;cursor:pointer}.btn.primary{background:#0e78a6}.btn.danger{background:#a94a4a}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px}table{width:100%;min-width:1160px;border-collapse:collapse;font-size:11px}th,td{padding:11px 10px;border-bottom:1px solid #e3e9ed;text-align:center;white-space:nowrap}th{background:#eef2f5;font-weight:900;color:#294a5e;position:sticky;top:0}td.left{text-align:left}.badge{display:inline-block;padding:4px 7px;border-radius:5px;font-size:10px;font-weight:900}.active-b{background:#45bd25;color:#fff}.pending-b{background:#f0ad2c;color:#fff}.disabled-b{background:#d2d9de;color:#566a75}.role{background:#eaf4f9;color:#1c6f99}.manage{display:flex;justify-content:center;gap:5px}.manage button{height:29px;border:1px solid #cad6dd;border-radius:6px;background:#fff;padding:0 8px;font-size:10px;cursor:pointer}.empty{padding:40px;text-align:center;color:var(--muted)}.audit{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.audit h2{margin:0 0 10px;font-size:17px}.audit-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.audit-item{padding:10px;border:1px solid #e0e8ed;border-radius:8px;background:#fafcfd;font-size:10px}.audit-item b,.audit-item span{display:block}.audit-item span{margin-top:4px;color:var(--muted)}dialog{width:min(680px,calc(100% - 28px));border:0;border-radius:16px;padding:0;box-shadow:0 18px 50px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(7,33,47,.45)}.modal-head{padding:18px 20px;background:#0e405e;color:#fff}.modal-head h2{margin:0;font-size:20px}.modal-body{padding:18px 20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.field span{display:block;margin-bottom:5px;font-size:10px;font-weight:900;color:#4d6878}.field input,.field select{width:100%;height:39px;border:1px solid #cbd8df;border-radius:8px;padding:0 10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 18px}.notice{padding:10px 12px;border-radius:8px;background:#f3f8fb;color:#567585;font-size:10px;margin-bottom:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{display:none}.audit-list{grid-template-columns:1fr}.main{padding:14px}.page-head{align-items:flex-start;flex-direction:column}.toolbar{align-items:flex-start;flex-direction:column}.toolbar-right{width:100%}.search{flex:1;width:auto}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}
</style>
</head>
<body>
<header class="top"><div class="brand"><img src="./assets/hangangbus-logo.png" alt="한강버스"><div><b>한강버스</b><span>운항환경 통합관리 포털</span></div></div><div class="top-actions"><span id="me">확인 중</span><a href="./home.html">메인 홈</a><button id="logout">로그아웃</button></div></header>
<div class="layout">
<aside><div class="nav-title">ADMINISTRATION</div><nav class="nav"><a href="./home.html">메인 홈</a><a class="active" href="./admin-users.html">사용자 관리</a><a href="./index.html">종합 대시보드</a><a href="./detail.html">전체 상세 모니터링</a></nav></aside>
<main class="main">
  <div class="page-head"><div><h1>사용자 관리</h1><p>승인 사용자, 역할, 활성상태와 로그인 기록을 관리합니다.</p></div><button id="openCreate" class="btn primary">+ 사용자 등록</button></div>
  <section class="toolbar"><div class="toolbar-left"><span id="count" class="count">목록 (0)</span></div><div class="toolbar-right"><input id="search" class="search" placeholder="ID·이름·이메일·소속 검색"><button id="reload" class="btn">새로고침</button></div></section>
  <div class="table-wrap"><table><thead><tr><th>사용자 ID</th><th>이름</th><th>이메일</th><th>소속</th><th>직책</th><th>권한</th><th>상태</th><th>최근 로그인</th><th>관리</th></tr></thead><tbody id="tbody"></tbody></table></div>
  <section class="audit"><h2>최근 접속·관리 기록</h2><div id="auditList" class="audit-list"></div></section>
</main>
</div>
<dialog id="userDialog"><div class="modal-head"><h2 id="dialogTitle">사용자 등록</h2></div><form id="userForm"><div class="modal-body"><div class="notice">신규 사용자는 관리자 등록 후에만 로그인할 수 있습니다. 임시 비밀번호는 첫 로그인 후 변경하도록 설정됩니다.</div><div class="form-grid"><label class="field"><span>사용자 ID</span><input id="fUserId" required></label><label class="field"><span>이름</span><input id="fName" required></label><label class="field full"><span>이메일</span><input id="fEmail" type="email" required></label><label class="field"><span>소속</span><input id="fOrg"></label><label class="field"><span>직책</span><input id="fPosition"></label><label class="field"><span>권한</span><select id="fRole"><option value="viewer">조회자</option><option value="operator">운영자</option><option value="admin">관리자</option></select></label><label class="field"><span>상태</span><select id="fStatus"><option value="pending">승인대기</option><option value="active">활성</option><option value="disabled">비활성</option></select></label><label id="passwordField" class="field full"><span>임시 비밀번호</span><input id="fPassword" type="password" minlength="10"></label></div></div><div class="modal-actions"><button id="cancelDialog" type="button" class="btn">취소</button><button type="submit" class="btn primary">저장</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id);let users=[],editingId=null;
const roleLabel={admin:'시스템관리자',operator:'운영자',viewer:'사용자'};const statusLabel={active:'활성',pending:'승인대기',disabled:'비활성'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(v){if(!v)return '-';try{return new Intl.DateTimeFormat('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(v))}catch{return '-'}}
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',cache:'no-store',...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});let j={};try{j=await r.json()}catch{}if(r.status===401){location.replace('/home.html?return=/admin-users.html');throw new Error('로그인이 필요합니다.')}if(!r.ok||!j.ok)throw new Error(j.message||j.error||'요청 실패');return j}
async function init(){const me=await api('/api/auth/me');if(me.user.role!=='admin'){alert('관리자 권한이 필요합니다.');location.replace('/home.html');return}$('me').textContent=`${me.user.displayName} · 관리자`;await Promise.all([loadUsers(),loadAudit()])}
async function loadUsers(){const j=await api('/api/admin/users');users=j.users||[];render()}
function render(){const q=$('search').value.trim().toLowerCase();const rows=users.filter(u=>!q||[u.user_id,u.display_name,u.email,u.organization,u.position].some(v=>String(v||'').toLowerCase().includes(q)));$('count').textContent=`목록 (${rows.length})`;const tb=$('tbody');if(!rows.length){tb.innerHTML='<tr><td colspan="9" class="empty">표시할 사용자가 없습니다.</td></tr>';return}tb.innerHTML=rows.map(u=>`<tr><td>${esc(u.user_id)}</td><td>${esc(u.display_name)}</td><td class="left">${esc(u.email)}</td><td>${esc(u.organization||'-')}</td><td>${esc(u.position||'-')}</td><td><span class="badge role">${roleLabel[u.role]||u.role}</span></td><td><span class="badge ${u.status==='active'?'active-b':u.status==='pending'?'pending-b':'disabled-b'}">${statusLabel[u.status]||u.status}</span></td><td>${date(u.last_login_at)}</td><td><div class="manage"><button data-edit="${esc(u.user_id)}">수정</button><button data-reset="${esc(u.user_id)}">PW초기화</button><button data-delete="${esc(u.user_id)}">삭제</button></div></td></tr>`).join('')}
async function loadAudit(){try{const j=await api('/api/admin/audit?limit=30');$('auditList').innerHTML=(j.logs||[]).slice(0,12).map(x=>`<div class="audit-item"><b>${esc(x.event_type)}</b><span>${esc(x.user_id||'-')} · ${date(x.created_at)}</span></div>`).join('')||'<div class="empty">기록 없음</div>'}catch(e){$('auditList').innerHTML='<div class="empty">기록 조회 실패</div>'}}
function openCreate(){editingId=null;$('dialogTitle').textContent='사용자 등록';$('fUserId').disabled=false;['fUserId','fName','fEmail','fOrg','fPosition','fPassword'].forEach(id=>$(id).value='');$('fRole').value='viewer';$('fStatus').value='pending';$('passwordField').style.display='block';$('fPassword').required=true;$('userDialog').showModal()}
function openEdit(id){const u=users.find(x=>x.user_id===id);if(!u)return;editingId=id;$('dialogTitle').textContent='사용자 수정';$('fUserId').value=u.user_id;$('fUserId').disabled=true;$('fName').value=u.display_name;$('fEmail').value=u.email;$('fOrg').value=u.organization||'';$('fPosition').value=u.position||'';$('fRole').value=u.role;$('fStatus').value=u.status;$('passwordField').style.display='none';$('fPassword').required=false;$('userDialog').showModal()}
$('userForm').addEventListener('submit',async e=>{e.preventDefault();const payload={userId:$('fUserId').value,displayName:$('fName').value,email:$('fEmail').value,organization:$('fOrg').value,position:$('fPosition').value,role:$('fRole').value,status:$('fStatus').value,tempPassword:$('fPassword').value};try{if(editingId){await api('/api/admin/users/'+encodeURIComponent(editingId),{method:'PATCH',body:JSON.stringify(payload)})}else{await api('/api/admin/users',{method:'POST',body:JSON.stringify(payload)})}$('userDialog').close();await Promise.all([loadUsers(),loadAudit()])}catch(err){alert(err.message)}})
$('tbody').addEventListener('click',async e=>{const edit=e.target.dataset.edit,reset=e.target.dataset.reset,del=e.target.dataset.delete;if(edit)return openEdit(edit);if(reset){const p=prompt(`${reset} 임시 비밀번호(10자 이상)`);if(!p)return;try{await api(`/api/admin/users/${encodeURIComponent(reset)}/reset-password`,{method:'POST',body:JSON.stringify({tempPassword:p})});alert('비밀번호를 초기화했습니다.');await loadAudit()}catch(err){alert(err.message)}return}if(del){if(!confirm(`${del} 사용자를 삭제하시겠습니까?\n가능하면 비활성화를 우선 사용하십시오.`))return;try{await api('/api/admin/users/'+encodeURIComponent(del),{method:'DELETE'});await Promise.all([loadUsers(),loadAudit()])}catch(err){alert(err.message)}}})
$('openCreate').onclick=openCreate;$('cancelDialog').onclick=()=>$('userDialog').close();$('reload').onclick=()=>Promise.all([loadUsers(),loadAudit()]);$('search').oninput=render;$('logout').onclick=async()=>{try{await fetch('/api/auth/logout',{method:'POST'})}catch{}location.replace('/home.html')};init().catch(e=>{console.error(e);});
</script>
</body></html>
