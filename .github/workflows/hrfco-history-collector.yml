name: HRFCO History Collector

on:
  workflow_dispatch:
  schedule:
    # 매시 07, 17, 27, 37, 47, 57분
    - cron: "7-59/10 * * * *"

permissions:
  contents: read

concurrency:
  group: hrfco-history-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Trigger Korea-placed History Worker
        env:
          HISTORY_API_URL: ${{ secrets.HISTORY_API_URL }}
          HISTORY_INGEST_TOKEN: ${{ secrets.HISTORY_INGEST_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${HISTORY_API_URL:-}" ]; then
            echo "::error::GitHub Secret 누락: HISTORY_API_URL"
            exit 1
          fi

          if [ -z "${HISTORY_INGEST_TOKEN:-}" ]; then
            echo "::error::GitHub Secret 누락: HISTORY_INGEST_TOKEN"
            exit 1
          fi

          ENDPOINT="${HISTORY_API_URL%/}/collect-now"
          RESPONSE_FILE="$(mktemp)"

          echo "History Worker 수동수집 호출 시작"

          curl \
            --silent \
            --show-error \
            --fail-with-body \
            --location \
            --connect-timeout 30 \
            --max-time 180 \
            --retry 3 \
            --retry-delay 12 \
            --retry-all-errors \
            --header "Authorization: Bearer ${HISTORY_INGEST_TOKEN}" \
            --output "${RESPONSE_FILE}" \
            "${ENDPOINT}"

          cat "${RESPONSE_FILE}"

          jq -e '
            .ok == true and
            (.results | type == "array") and
            ([.results[].ok] | all)
          ' "${RESPONSE_FILE}" > /dev/null

          echo
          echo "HRFCO 수집 및 D1 저장 성공"
